name: Deploy

# run-name only has the github, inputs and vars contexts, so it cannot use the
# build tag from the setup job. It names the trigger and the thing being shipped,
# which is what tells two runs apart in the Actions list.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.draft
          && format('Rehearsal (draft) · {0} · @{1}', github.ref_name, github.actor)
          || format('Manual release · {0} · @{1}', github.ref_name, github.actor))
      || format('Release · {0}', github.event.head_commit.message) }}

on:
  push:
    branches:
      - main
  # Manual runs exist to rehearse a release without publishing anything:
  # they can produce a draft and never push the Docker image.
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

# The only project specific values in this workflow. APP_NAME names the release
# and its APKs, DOCKER_IMAGE is where the server image is pushed to (lowercase).
env:
  APP_NAME: Trails
  DOCKER_IMAGE: ghcr.io/maketrails/trails

# One deploy at a time. Two runs side by side could get the same build tag and
# would both list the same changelog entries. A run waiting here may be replaced
# by a newer one; nothing is lost, the newer run's scope reaches back to the
# last successful deploy, see "Determine affected projects".
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # To find the last successful deploy.
      actions: read
    outputs:
      build_tag: ${{ steps.vars.outputs.build_tag }}
      build_timestamp: ${{ steps.vars.outputs.build_timestamp }}
      date_formatted: ${{ steps.vars.outputs.date_formatted }}
      build_app: ${{ steps.scope.outputs.app }}
      build_server: ${{ steps.scope.outputs.server }}
    steps:
      - name: Generate vars
        id: vars
        run: |
          TIMESTAMP=$(date +%s)
          TAG=$(date -d @$TIMESTAMP '+%Y%m%d_%H%M')
          DATE_FORMATTED=$(date -d @$TIMESTAMP '+%d.%m.%Y %H:%M')
          echo "build_timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "build_tag=$TAG" >> $GITHUB_OUTPUT
          echo "date_formatted=$DATE_FORMATTED" >> $GITHUB_OUTPUT

      # A push to main is one or more merged pull requests -- a stack of them
      # lands in a single push -- and each declares which parts of the system it
      # touches through its project:* labels. The release builds what their
      # labels together need, and nothing more.
      # The pull requests are all those merged since the last successful deploy,
      # not just those of this push: a stack merged through a merge queue may
      # arrive in several pushes, and a run that failed or was replaced while
      # waiting would otherwise leave its changes unbuilt. They are found through
      # their merge commit, which every layer of a merged stack shares -- the
      # commit's own associated pull requests name only one of them.
      # Manual runs and pushes without a pull request carry no labels, so they
      # fall back to building everything rather than silently shipping nothing.
      # project:other is the deliberate empty scope -- documentation, CI, tooling:
      # it is a label, so it never reaches that fallback, and it matches nothing
      # below, so neither job runs.
      - name: Determine affected projects
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          ALL=$'project:app\nproject:server\nproject:webapp'
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "Manual run: building every project."
            LABELS="$ALL"
          else
            BASE=$(gh run list --workflow deploy.yaml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""')
            # The very first deploy has no predecessor, so it covers this push.
            [ -n "$BASE" ] || BASE=$BEFORE
            echo "Covering the pull requests merged since $BASE."

            # Empty when the range cannot be listed completely (the compare API
            # stops at 250 commits), which builds everything below.
            SHAS=""
            if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
              SHAS=$(gh api "repos/$GH_REPO/compare/$BASE...$GITHUB_SHA" \
                --jq 'if .total_commits > (.commits | length) then empty else .commits[].sha end' || true)
            fi

            if [ -z "$SHAS" ]; then
              echo "::notice::Could not list the commits since $BASE, building every project."
              LABELS="$ALL"
            else
              export SHAS
              MERGED=$(gh pr list --state merged --limit 100 --json number,labels,mergeCommit \
                --jq '[.[] | select(.mergeCommit.oid as $oid | env.SHAS | split("\n") | any(. == $oid))]')
              printf 'Pull requests: %s\n' "$(printf '%s' "$MERGED" | jq -r 'map("#\(.number)") | join(" ")')"
              LABELS=$(printf '%s' "$MERGED" | jq -r '[.[].labels[].name] | unique | .[]')
              if [ -z "$LABELS" ]; then
                echo "::notice::No pull request labels found since $BASE, building every project."
                LABELS="$ALL"
              fi
            fi
          fi
          printf 'Labels:\n%s\n' "$LABELS"

          has() { printf '%s\n' "$LABELS" | grep -qxF "$1"; }

          APP=false
          SERVER=false
          has 'project:app' && APP=true
          # The image carries the Ktor server and the SvelteKit app, so either one rebuilds it.
          { has 'project:server' || has 'project:webapp'; } && SERVER=true

          # A merge that builds nothing is the expected outcome for documentation, CI and
          # tooling -- but it is also what a mislabelled release looks like, so the two are
          # told apart here rather than left to whoever reads the empty run afterwards.
          if [ "$APP" = false ] && [ "$SERVER" = false ]; then
            if has 'project:other'; then
              echo "::notice::Labelled project:other, so there is nothing to build or publish."
            else
              echo "::warning::No project:* label decides anything here, so nothing is built. Add project:other if that is intended."
            fi
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          {
            echo "### Build scope"
            echo "- App: \`$APP\`"
            echo "- Server: \`$SERVER\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-server:
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.build_server == 'true'
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Has to match the JDK toolchain of :server, see server/build.gradle.kts.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: >
          ./gradlew :server:buildServerJar
          -Pmaven.pkg.github.com.user=${{ secrets.GH_USERNAME }}
          -Pmaven.pkg.github.com.token=${{ secrets.GH_REGISTRY_TOKEN }}

      # The jar the Dockerfile expects at the context root; the name comes from buildServerJar.
      - name: Move artifact
        run: mv server/build/libs/server*.jar server-all.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: server-all.jar
          name: server_build.jar
          if-no-files-found: error
          retention-days: 4

  build-web:
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.build_server == 'true'
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up GitHub Packages npm auth
        run: |
          echo "@Julius-Babies:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_REGISTRY_TOKEN }}" >> .npmrc
          echo "engine-strict=true" >> .npmrc

      - name: Install dependencies
        run: bun install

      - name: Build web
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: web/build
          name: web_build
          if-no-files-found: error
          retention-days: 4

  build-docker:
    runs-on: ubuntu-latest
    needs: [setup, build-server, build-web]
    if: needs.setup.outputs.build_server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Download server artifact
        uses: actions/download-artifact@v8
        with:
          name: server_build.jar
          path: ./

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web_build
          path: web_build/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # A draft run still builds the image to prove it builds, but does not
          # overwrite :latest. On a push to main there is no input, so this is true.
          push: ${{ !inputs.draft }}
          tags: ${{ env.DOCKER_IMAGE }}:latest

  build-android:
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.build_app == 'true'
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - uses: ./.github/actions/setup-android-project
        name: Setup Project
        with:
          keystore_file: ${{ secrets.KEYSTORE_FILE }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          mapbox_public_token: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          mapbox_secret_token: ${{ secrets.MAPBOX_SECRET_TOKEN }}
          play_developer_signing_id: ${{ secrets.PLAY_DEVELOPER_SIGNING_ID }}

      - name: Build Android APK
        env:
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
          BUILD_TAG: ${{ needs.setup.outputs.build_tag }}
        run: ./gradlew :app:android:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: app/android/build/outputs/apk/release/
          compression-level: 0
          if-no-files-found: error

  create_release:
    runs-on: ubuntu-latest
    needs: [setup, build-docker, build-android]
    # A release is the app's delivery vehicle: it carries the APKs and the
    # changelog the app reads, so a server-only change produces none. Its
    # changelog entries are not lost — the changelog is generated from the
    # commits since the last release, so they land in the next app release.
    # A skipped docker build is fine here, a failed one is not.
    if: >-
      !cancelled()
      && needs.build-android.result == 'success'
      && needs.build-docker.result != 'failure'
    permissions:
      packages: write
      contents: write
      issues: read
    env:
      KOTLIN_VERSION: '2.4.10'
    steps:
      - uses: actions/checkout@v5
        name: Checkout code
        with:
          # The changelog is built from the commits since the last release,
          # which needs the history and the tags, not just the tip.
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The runner image ships no kotlinc, so pin the compiler instead of
      # depending on a third party action.
      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: ~/.kotlin-compiler
          key: kotlin-compiler-${{ env.KOTLIN_VERSION }}

      - name: Set up Kotlin
        run: |
          if [ ! -x "$HOME/.kotlin-compiler/kotlinc/bin/kotlin" ]; then
            curl -sSLf -o /tmp/kotlin-compiler.zip \
              "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
            mkdir -p "$HOME/.kotlin-compiler"
            unzip -q /tmp/kotlin-compiler.zip -d "$HOME/.kotlin-compiler"
          fi
          echo "$HOME/.kotlin-compiler/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Cache changelog script dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: changelog-script-${{ hashFiles('.github/generate_changelog.main.kts') }}
          restore-keys: changelog-script-

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: v${{ needs.setup.outputs.build_tag }}
        run: kotlin .github/generate_changelog.main.kts

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: apks/

      - name: Rename APK artifacts for release
        run: |
          for apk in apks/*.apk; do
            base=$(basename "$apk")
            mv "$apk" "apks/$APP_NAME ${{ needs.setup.outputs.build_tag }} ${base}"
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/${{ env.APP_NAME }}*
            build/changelog/changelog*.json
          body_path: build/changelog/CHANGELOG.md
          draft: ${{ inputs.draft || false }}
          prerelease: false
          make_latest: ${{ !inputs.draft }}
          name: ${{ env.APP_NAME }} (${{ needs.setup.outputs.date_formatted }})
          fail_on_unmatched_files: true
          tag_name: v${{ needs.setup.outputs.build_tag }}
