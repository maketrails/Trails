name: Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

# A new push to the pull request makes the run for the previous one pointless.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The two jobs share nothing, so they run side by side.
jobs:
  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Has to match the JDK toolchain of :server, see server/build.gradle.kts.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: >
          ./gradlew :server:test
          -Pmaven.pkg.github.com.user=${{ secrets.GH_USERNAME }}
          -Pmaven.pkg.github.com.token=${{ secrets.GH_REGISTRY_TOKEN }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: server/build/reports/tests/test
          name: server_test_report
          retention-days: 7

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up GitHub Packages npm auth
        run: |
          echo "@Julius-Babies:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_REGISTRY_TOKEN }}" >> .npmrc
          echo "engine-strict=true" >> .npmrc

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test
